ion}</span></div><div class="progress-rail">${['订单确认','技术确认','备货生产','发货','到货','安装调试','验收','完成'].map((x,i)=>`<div class="progress-tile ${p.execution==='执行中'&&i<2?'done':p.execution==='执行中'&&i===2?'current':''}">${i+1} · ${x}</div>`).join('')}</div></div><div class="split"><div class="card cardpad"><div class="sectionhead"><h2>全过程进度日志</h2><span class="chip">销售可查看安全摘要</span></div><div class="timeline">${events.map(u=>`<div class="timeitem"><div class="time">${u.at} · ${u.user} · ${u.phase}</div><b>${escapeHTML(u.title)}</b><div class="sub">${escapeHTML(u.note)}</div></div>`).join('')||'<div class="empty">暂无进展，点击右上角记录。</div>'}</div></div><div class="card cardpad"><div class="sectionhead"><h2>关联报价</h2>${canQuote()?linkButton('+ 新建报价','quote-builder','','btn mini soft'):''}</div>${canQuote()?S.quotes.filter(q=>q.projectId===p.id).map(q=>`<div class="designline"><div><b style="font-size:12px">${q.code}</b><div class="micro">${badge(q.state)} · ${q.company} 公司</div></div><div style="margin-left:auto;font-weight:700">${money(q.amount)}</div></div>`).join('')||'<div class="empty">暂无关联报价</div>':'<div class="notice">销售角色默认不查看报价金额与报价文件。项目阶段和已确认业绩的对外字段仍可查看。</div>'}<div class="warnnote" style="margin-top:15px">业务规则：一份报价中标或失标不会自动改变其他报价状态；订单/合同确认才进入可核实业绩。</div></div></div>`}

function quoteBuilder(){if(!canQuote())return denied();const product=getProduct(QB.productId)||S.products[0],total=QB.lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100)*(1+l.tax),0);return head('QUOTE BUILDER','新建工业产品报价','先选出具公司与接收客户，再选产品参数、调整数量价格并生成快照',linkButton('← 返回报价中心','nav','data-page="quotes"'))+`<div class="steps"><span class="step current">01 报价主体与接收方</span><span class="step current">02 产品和参数</span><span class="step current">03 商务价格与条款</span><span class="step">04 生成版本</span></div><div class="split"><div class="grid"><div class="card cardpad"><div class="sectionhead"><h2>01 · 报价关系</h2><span class="chip">必须明确接收方</span></div><div class="fieldset"><div class="formfield"><label>出具报价的公司</label><select class="select" id="qb-company">${['A','B','C'].map(c=>`<option value="${c}" ${QB.company===c?'selected':''}>${c} 公司 · ${c==='A'?'润滑设备':c==='B'?'制动器':'电缆与卷筒'}模板</option>`).join('')}</select></div><div class="formfield"><label>关联项目</label><select class="select" id="qb-project">${S.projects.map(p=>`<option value="${p.id}" ${QB.projectId===p.id?'selected':''}>${escapeHTML(p.name)}</option>`).join('')}</select></div><div class="formfield full"><label>报价接收客户（与项目归属无关）</label><select class="select" id="qb-recipient">${S.customers.map(c=>`<option value="${c.id}" ${QB.recipient===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select></div><div class="formfield"><label>我方联系人</label><input class="input" id="qb-senderContact" value="${escapeHTML(QB.senderContact||'商务助理')}"></div><div class="formfield"><label>对方联系人</label><input class="input" id="qb-recipientContact" value="${escapeHTML(QB.recipientContact||'待填写')}"></div></div></div><div class="card cardpad"><div class="sectionhead"><h2>02 · 添加产品和参数</h2><span class="sub">选择参数输出到报价单</span></div><div class="fieldset"><div class="formfield full"><label>产品型号</label><select class="select" id="qb-product">${S.products.map(p=>`<option value="${p.id}" ${QB.productId===p.id?'selected':''}>${p.model}｜${p.name}</option>`).join('')}</select></div><div class="formfield"><label>数量（${product.unit}）</label><input class="input" id="qb-qty" type="number" min="0.01" step="0.01" value="${QB.qty}"></div><div class="formfield"><label>未税单价（元）</label><input class="input" id="qb-price" type="number" min="0" step="0.01" value="${QB.price}"></div><div class="formfield"><label>折扣率（%）</label><input class="input" id="qb-discount" type="number" min="0" max="99" step="1" value="${QB.discount}"></div><div class="formfield"><label>默认税率</label><input class="input" disabled value="${(product.tax*100).toFixed(0)}%（来自产品资料）"></div><div class="formfield full"><label>本次报价展示参数（可逐项选择）</label><div class="quote-model-params">${product.params.map((p,i)=>`<label><input type="checkbox" class="qb-param" value="${i}" ${QB.params.includes(i)?'checked':''}/> ${escapeHTML(p)}</label>`).join('')}</div></div></div><div style="margin-top:16px">${linkButton('+ 添加到报价明细','add-quote-line','','btn soft')}</div></div><div class="card cardpad"><div class="sectionhead"><h2>03 · 当前报价明细</h2><span class="chip amber">价格为演示数据</span></div>${QB.lines.length?QB.lines.map((l,i)=>`<div class="qline"><div><b>${l.model}</b><div class="micro">${escapeHTML(l.params.join('、')||'无展示参数')}</div></div><span class="sub">× ${l.qty}</span><b style="font-size:12px">${money(l.price)}</b><b style="font-size:12px">${money(l.qty*l.price*(1-l.discount/100)*(1+l.tax))}</b>${linkButton('×','remove-line',`data-index="${i}"`,'btn mini')}</div>`).join(''):'<div class="empty">还没有明细，先从上方选择一个型号。</div>'}<div class="formfield" style="margin-top:14px"><label>商务条款</label><textarea class="input" id="qb-term" rows="3">${escapeHTML(QB.term)}</textarea></div></div></div><div><div class="card cardpad" style="position:sticky;top:90px"><div class="sectionhead"><h2>报价实时汇总</h2><span class="chip">${QB.company} 公司</span></div><div class="kv"><span>产品行数</span><span>${QB.lines.length} 行</span><span>不含税金额</span><span>${money(QB.lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100),0))}</span><span>税额</span><span>${money(QB.lines.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100)*l.tax,0))}</span></div><div style="border-top:1px solid #dfe9ed;margin-top:16px;padding-top:18px"><div class="sub">含税总计（演示计算）</div><div style="font-size:29px;font-weight:800;color:#0a6f68">${money(total)}</div></div><div class="warnnote" style="margin:17px 0">生产系统须使用 Decimal、约定税额舍入规则及服务器计算，不使用浏览器计算值作为财务依据。</div>${linkButton('生成报价快照并预览','create-quote',QB.lines.length?'':'disabled','btn primary')}<div class="footnote">演示原型以浏览器打印/保存为 PDF；正式版由服务端生成并冻结 PDF 文件。</div></div></div></div>`}
function execution(){const ex=S.projects.filter(p=>p.execution==='执行中');return head('FULFILLMENT TRACKING','项目执行与交付进度','中标/合同后的关键节点由商务助理与财务更新，销售查看安全版状态',canExecute()?linkButton('+ 更新执行节点','new-update','data-phase="执行"','btn primary'):'')+`<div class="grid cols2">${ex.map(p=>`<div class="card cardpad"><div class="sectionhead"><h2>${escapeHTML(p.name)}</h2>${badge(p.execution)}</div><div class="sub">${p.code} · ${p.machine} · ${p.location}</div><div class="progress-rail" style="margin:18px 0">${['订单确认','技术确认','备货生产','发货','到货','安装调试','验收','完成'].map((x,i)=>`<div class="progress-tile ${i<(p.milestoneIndex??2)?'done':i===(p.milestoneIndex??2)?'current':''}">${x}</div>`).join('')}</div><div class="notice">当前模拟节点：${['订单确认','技术确认','备货生产','发货','到货','安装调试','验收','完成'][p.milestoneIndex??2]}；后续节点未确认。销售可看此摘要，${canFinance()?'财务权限可编辑相关执行进度。':'不显示任何资金字段。'}</div><div class="actions" style="margin-top:14px">${linkButton('项目详情','detail',`data-id="${p.id}"`,'btn mini')}</div></div>`).join('')}</div><div class="warnnote" style="margin-top:16px">这里不等于完整 ERP 生产管理。首期只做有限里程碑、责任人、预计/实际日期、进展日志与附件；采购、库存、发票、回款自动核算等后续再评估。</div>`}
function performance(){return head('CONFIRMED PERFORMANCE','内部业绩与历史台账','报价接受不直接等于确认业绩；合同/订单或负责人确认后可入库',linkButton('+ 补录历史业绩','new-performance','','btn primary'))+`<div class="grid cols3" style="margin-bottom:16px"><div class="card kpi"><div class="label">业绩记录</div><div class="value">${S.performances.length}</div><div class="delta">含历史手工补录示例</div></div><div class="card kpi"><div class="label">可形成公开案例</div><div class="value">${S.performances.filter(x=>x.confirmed).length}</div><div class="delta">仍须核对可对外展示字段</div></div><div class="card kpi"><div class="label">${canSeeMoney()?'内部业绩金额（演示）':'可见金额范围'}</div><div class="value" style="font-size:${canSeeMoney()?25:20}px">${canSeeMoney()?money(S.performances.reduce((a,p)=>a+(p.amount||0),0)):'不可查看'}</div><div class="delta">销售默认不读金额字段</div></div></div><div class="card cardpad"><div class="tablewrap"><table class="data"><thead><tr><th>案例 / 项目</th><th>产品 / 主机</th><th>地区 / 年份</th><th>确认状态</th>${canSeeMoney()?'<th>内部金额</th>':''}<th>公开字段</th></tr></thead><tbody>${S.performances.map(p=>`<tr><td><b>${escapeHTML(p.title)}</b><div class="micro">${escapeHTML(getP(p.projectId)?.name||'历史项目')}</div></td><td>${p.product}<div class="micro">${p.machine}</div></td><td>${p.area}<div class="micro">${p.year}</div></td><td>${badge(p.confirmed?'已确认':'待核实')}</td>${canSeeMoney()?`<td>${money(p.amount)}</td>`:''}<td>${p.confirmed?linkButton('案例预览','nav','data-page="cases"','btn mini'):['leader','admin'].includes(S.role)?linkButton('确认业绩','confirm-performance',`data-id="${p.id}"`,'btn mini soft'):'<span class="sub">待负责人确认</span>'}</td></tr>`).join('')}</tbody></table></div></div>`}
// Public case mapping uses an explicit allowlist. Internal amount is intentionally not mapped.
function publicCase(p){return {title:p.title,year:p.year,area:p.area,product:p.product,machine:p.machine,investor:p.investor,summary:p.summary}}
function cases(){const selected=S.performances.filter(x=>x.confirmed&&S.selectedCases.includes(x.id)).map(publicCase);return head('CUSTOMER-FACING CASES','客户案例册生成器','从内部业绩中选择项目，仅通过公开字段白名单生成案例内容',canCase()?linkButton('查看案例打印预览','print-cases','','btn primary'):'')+`<div class="split"><div class="card cardpad"><div class="sectionhead"><h2>选择要展示的业绩</h2><span class="chip">${S.selectedCases.length} 条已选择</span></div><div class="notice" style="margin-bottom:15px">客户没有首期系统登录账号。案例 PDF 由内部人员生成后线下发送；默认不显示报价单、合同金额、采购成本、毛利等字段。</div>${S.performances.filter(p=>p.confirmed).map(p=>`<label class="designline" style="cursor:pointer"><input class="casecheck" type="checkbox" data-action="case-toggle" value="${p.id}" ${S.selectedCases.includes(p.id)?'checked':''}><div><b style="font-size:12px">${escapeHTML(p.title)}</b><div class="sub">${p.product} · ${p.area} · ${p.year}</div></div><span class="pill" style="margin-left:auto">对外可选</span></label>`).join('')}<div class="warnnote" style="margin-top:18px">正式版必须增加图片/业主名称的公开授权检查，不能只靠“隐藏金额列”来脱敏；导出接口也必须执行白名单取数。</div></div><div class="card cardpad"><div class="sectionhead"><h2>客户看到的内容</h2><span class="chip blue">公开版预览</span></div><div class="casepreview"><div class="kicker">SELECTED PROJECT REFERENCES</div><h2 style="margin:8px 0 18px">工业项目应用业绩案例</h2>${selected.length?selected.map((c,i)=>`<div class="caseitem"><div class="micro">CASE ${String(i+1).padStart(2,'0')} · ${c.year} · ${c.area}</div><h3>${escapeHTML(c.title)}</h3><p class="sub">应用设备：${escapeHTML(c.machine)}　配套产品：${escapeHTML(c.product)}</p><p style="font-size:12px;line-height:1.8">${escapeHTML(c.summary)}</p></div>`).join(''):'<div class="empty">请选择至少一条案例</div>'}</div><div class="footnote">预览中不存在内部 amount、报价底价、毛利等字段。正式 PDF 由后端使用相同字段白名单生成。</div></div></div>`}
function blueprint(){return head('PRODUCT BLUEPRINT','设计决策与阶段路线','把甲方已确认与仍需确认的事项分开，防止原型推断被误认为合同范围')+`<div class="grid cols3" style="margin-bottom:18px"><div class="card cardpad"><div class="kicker">CONFIRMED</div><div style="font-size:29px;font-weight:800;color:#07877d">11</div><div class="sub">主要方向已确认</div></div><div class="card cardpad"><div class="kicker">CRITICAL OPEN POINTS</div><div style="font-size:29px;font-weight:800;color:#ad742e">6</div><div class="sub">需要二轮短会冻结</div></div><div class="card cardpad"><div class="kicker">PHASE ONE</div><div style="font-size:29px;font-weight:800;color:#1d638e">G0–G4</div><div class="sub">逐门禁交付，而非一次堆满</div></div><div class="grid cols2"><div class="card cardpad"><div class="sectionhead"><h2>确认的业务原则</h2><span class="chip">依据回填表</span></div>${[['云端与多人协作','1～5 人使用，云服务器，已有域名，常规数据库'],['内部角色边界','商务助理/负责人报价与型号维护，销售做项目和业绩，财务更新中标后进度'],['共享数据与独立模板','三家公司共享客户、产品、项目和报价业务库，但报价出具主体必须明确'],['固定报价文件','三套固定模板，价格手调，首期无线上审批盖章'],['初期覆盖范围','基础+业绩台账+对外案例 PDF，历史业绩逐步补录']].map(x=>`<div class="designline"><div class="n">✓</div><div><b style="font-size:12px">${x[0]}</b><div class="sub">${x[1]}</div></div></div>`).join('')}</div><div class="card cardpad"><div class="sectionhead"><h2>需要甲方再确认</h2><span class="chip amber">不影响先做 G0</span></div>${[['01','本地报价是桌面入口还是断网离线？'],['02','销售是否可查看本人报价的非金额摘要？'],['03','合同/订单确认与负责人确认是否二选一？'],['04','三模板最终样本及税价口径如何？'],['05','执行阶段财务需要更新到什么程度？'],['06','域名子域名、服务器地域与 DNS 权限？']].map(x=>`<div class="designline"><div class="n">${x[0]}</div><b style="font-size:12px">${x[1]}</b></div>`).join('')}</div></div><div class="card cardpad" style="margin-top:18px"><div class="sectionhead"><h2>交付门禁</h2><span class="chip blue">以真实测试为准</span></div><div class="grid cols3">${[['G0','数据模型 / 模板 POC / 权限冻结'],['G1','客户 / 产品 / 项目 / 跟进'],['G2','三公司报价 / PDF / 版本'],['G3','合同业绩 / 执行 / 案例'],['G4','导入 / 备份恢复 / UAT']].map(x=>`<div class="choice"><h3>${x[0]}</h3><small>${x[1]}</small></div>`).join('')}</div><div class="warnnote" style="margin-top:18px">首期不做离线双向同步、客户门户、复杂 ERP、任意 Word 模板设计器、自动电子签章、AI 和地图。图示为原型数据，生产系统需服务端 API、权限校验、数据库和备份恢复。</div></div>`}
function denied(){return '<div class="card cardpad"><h2>当前模拟角色不具备访问权限</h2><p class="muted">此权限限制仅为前端演示。正式系统需要后端对每个接口和文件下载进行授权检查。</p></div>'}
function render(){if(S.page==='quotes'&&!canQuote())S.page='dashboard';if(S.page==='products'&&!canQuote())S.page='dashboard';nav();el('root').innerHTML=({dashboard,projects,detail,customers,products,quotes,'quote-builder':quoteBuilder,execution,performance,cases,blueprint}[S.page]||dashboard)()+'<div class="footnote">工业销售管理系统 V2 · 交互评审原型 · 所有数据、金额、联系人及进度均为虚构示例 · 不连接服务器、不构成生产系统或报价文件。</div>'}
function modal(title,body,buttons){el('modals').innerHTML=`<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-action="close-modal">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${buttons||`${linkButton('关闭','close-modal')}`}</div></div></div>`}

function newProject(){modal('新建项目（演示）',`<div class="fieldset"><div class="formfield full"><label>项目名称 *</label><input id="np-name" class="input" placeholder="例如：某港口卸料设备更新"></div><div class="formfield"><label>所属行业</label><select class="select" id="np-industry"><option>港口</option><option>电厂</option><option>钢厂</option><option>煤化工</option></select></div><div class="formfield"><label>主机类型</label><select class="select" id="np-machine"><option>斗轮机</option><option>圆堆</option><option>皮带机</option><option>其他</option></select></div><div class="formfield full"><label>关联客户（可选，允许未确定时为空）</label><select class="select" id="np-party"><option value="0">暂未确定客户</option>${S.customers.map(x=>`<option value="${x.id}">${escapeHTML(x.name)}</option>`).join('')}</select></div></div><div class="notice" style="margin-top:16px">正式版可以随时追加多个主机厂、投资方、业主和总包单位。创建项目不强制选择客户。</div>`,`${linkButton('取消','close-modal')}${linkButton('创建项目','save-project','','btn primary')}`)}
function newCustomer(){modal('新增客户资料（演示）',`<div class="fieldset"><div class="formfield full"><label>公司名称 *</label><input id="nc-name" class="input" placeholder="请输入完整公司名称"></div><div class="formfield"><label>主要类型</label><select class="select" id="nc-kind"><option>主机厂</option><option>业主</option><option>投资方</option><option>总包单位</option><option>代理商</option><option>贸易商</option></select></div><div class="formfield"><label>地区</label><input id="nc-region" class="input" placeholder="地区"></div></div>`,`${linkButton('取消','close-modal')}${linkButton('保存客户','save-customer','','btn primary')}`)}
function newProduct(){modal('新增产品型号（演示）',`<div class="fieldset"><div class="formfield"><label>产品型号 *</label><input id="nprod-model" class="input" placeholder="型号/唯一代码"></div><div class="formfield"><label>名称 *</label><input id="nprod-name" class="input" placeholder="产品名称"></div><div class="formfield"><label>分类</label><select class="select" id="nprod-type"><option>润滑系统</option><option>制动器</option><option>电缆</option><option>电缆卷筒</option></select></div><div class="formfield"><label>参考未税单价</label><input id="nprod-price" class="input" type="number" min="0" value="1000"></div><div class="formfield full"><label>技术参数（用分号分隔）</label><textarea id="nprod-params" class="input" rows="3" placeholder="功率 2.2kW；压力 25MPa；控制方式 PLC"></textarea></div></div>`,`${linkButton('取消','close-modal')}${linkButton('加入产品库','save-product','','btn primary')}`)}
function newUpdate(force){const stage=force||(['finance'].includes(S.role)?'执行':'售前');const choices=S.projects.filter(p=>stage!=='执行'||p.execution==='执行中');modal('记录项目进展（演示）',`<div class="fieldset"><div class="formfield full"><label>选择项目</label><select id="nu-project" class="select">${choices.map(p=>`<option value="${p.id}" ${S.selectedProject===p.id?'selected':''}>${escapeHTML(p.name)}</option>`).join('')}</select></div><div class="formfield"><label>进展阶段</label><select id="nu-phase" class="select"><option ${stage==='售前'?'selected':''}>售前</option><option ${stage==='执行'?'selected':''}>执行</option></select></div><div class="formfield"><label>执行节点（仅执行阶段生效）</label><select id="nu-milestone" class="select">${["订单确认","技术确认","备货生产","发货","到货","安装调试","验收","完成"].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></div><div class="formfield"><label>记录标题</label><input id="nu-title" class="input" placeholder="例如：客户完成技术澄清"></div><div class="formfield full"><label>进展说明</label><textarea id="nu-note" class="input" rows="4" placeholder="记录沟通、发货、备货等客观事实和下一行动"></textarea></div></div><div class="notice" style="margin-top:14px">权限演示：销售只允许录入售前进展；财务只允许录入执行进展；商务和负责人可编辑两阶段。真实限制必须在服务端实现。</div>`,`${linkButton('取消','close-modal')}${linkButton('保存进展','save-update','','btn primary')}`)}
function confirmPerformance(id){const p=S.performances.find(x=>x.id===+id);if(!p||p.confirmed)return;modal('确认历史业绩（演示）',`<p class="sub">${escapeHTML(p.title)}</p><div class="fieldset"><div class="formfield full"><label>确认依据</label><select class="select" id="cp-basis"><option>负责人手工确认</option><option>已取得合同/订单证明</option></select></div><div class="formfield full"><label>确认备注 / 依据说明 *</label><textarea id="cp-note" class="input" rows="3" placeholder="简述已核验的项目事实或合同/订单资料"></textarea></div></div><div class="warnnote" style="margin-top:12px">此处仅演示确认状态；正式版本需附件、授权与操作审计，且规则以甲方二轮确认为准。</div>`,`${linkButton('取消','close-modal')}${linkButton('确认','save-confirm',`data-id="${id}"`,'btn primary')}`)}
function newPerformance(){modal('补录业绩（演示）',`<div class="fieldset"><div class="formfield full"><label>业绩名称 *</label><input id="nperf-title" class="input" placeholder="某港口设备改造项目"></div><div class="formfield"><label>关联项目</label><select id="nperf-project" class="select">${S.projects.map(p=>`<option value="${p.id}">${escapeHTML(p.name)}</option>`).join('')}</select></div><div class="formfield"><label>产品类别</label><select id="nperf-product" class="select"><option>润滑系统</option><option>制动器</option><option>电缆</option><option>电缆卷筒</option></select></div><div class="formfield"><label>主机类型</label><select id="nperf-machine" class="select"><option>斗轮机</option><option>圆堆</option><option>皮带机</option></select></div><div class="formfield"><label>项目年份</label><input id="nperf-year" class="input" value="2026"></div><div class="formfield full"><label>对外项目简介</label><textarea id="nperf-summary" class="input" rows="3" placeholder="不填写报价、成本等敏感数据"></textarea></div></div><div class="warnnote" style="margin-top:15px">正式系统补录必须区分“待核实/已确认”，并保留证明依据及确认人；本演示新增为待核实记录，不会自动对外发布。</div>`,`${linkButton('取消','close-modal')}${linkButton('保存待核实业绩','save-performance','','btn primary')}`)}
function quotationHTML(q){const rows=q.items.map((l,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(l.model)}<div style="font-size:10px">${escapeHTML(l.params.join('；'))}</div></td><td>${escapeHTML(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${Math.round(l.tax*100)}%</td><td>${money(l.qty*l.price*(1-l.discount/100)*(1+l.tax))}</td></tr>`).join('');return `<div class="paper"><div style="text-align:right;font-size:11px;color:#567">${q.company} 公司 · 固定模板演示</div><h2>${q.company} 公司工业设备报价单</h2><div style="display:flex;justify-content:space-between;font-size:12px;margin:16px 0"><div>报价编号：${q.code}<br>项目名称：${escapeHTML(getP(q.projectId)?.name||'')}</div><div>接收单位：${escapeHTML(getC(q.recipient)?.name||'')}<br>我方联系人：${escapeHTML(q.senderContact||'商务助理')} · 对方联系人：${escapeHTML(q.recipientContact||'待填写')}<br>生成日期：${q.created}</div></div><table><thead><tr><th>序号</th><th>规格型号/主要参数</th><th>名称</th><th>数量</th><th>单价（未税）</th><th>税率</th><th>含税金额</th></tr></thead><tbody>${rows}</tbody></table><p style="text-align:right;font-weight:700;margin:22px 0">含税总价：${money(q.amount)}</p><p style="font-size:12px"><b>商务条款：</b>${escapeHTML(q.term||'以正式文件为准。')}</p><div style="margin-top:32px;border-top:1px solid #e5ecef;padding-top:10px;font-size:11px;color:#667">仅为交互原型输出，不作为正式报价文件、法律承诺或财务记录。</div></div>`}
function printDocument(inner,title){const w=window.open('','_blank');if(!w){notify('弹窗被浏览器阻止，请允许弹窗后重试');return}w.document.write(`<html><head><meta charset="utf-8"><title>${escapeHTML(title)}</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;color:#163144;padding:32px;font-size:13px}.paper{max-width:960px;margin:auto}.paper h2{text-align:center}.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{border:1px solid #aeb8bf;padding:8px;font-size:12px}.paper th{background:#eef4f5}.caseitem{padding:15px 0;border-bottom:1px solid #dce8e8}h3{margin:8px 0}.micro{color:#6b8b96;font-size:11px} .sub{font-size:12px}.kicker{color:#8aa;font-size:11px}@page{size:A4;margin:16mm}@media print{body{padding:0}}</style></head><body>${inner}</body></html>`);w.document.close();setTimeout(()=>w.print(),250)}
function previewQuote(id){const q=S.quotes.find(x=>x.id===+id);if(!q)return;modal('报价预览 · '+q.code,quotationHTML(q),`${linkButton('关闭','close-modal')}${linkButton('浏览器打印 / 保存 PDF','print-quote',`data-id="${q.id}"`,'btn primary')}`)}
function printCases(){if(!canCase()){notify('当前角色仅可预览，不能导出对外案例');return}const selected=S.performances.filter(x=>x.confirmed&&S.selectedCases.includes(x.id)).map(publicCase);if(!selected.length){notify('请先选择至少一条业绩案例');return}const body=`<div class="paper"><div class="kicker">PUBLIC PROJECT REFERENCES</div><h2>工业项目应用业绩案例</h2><p style="text-align:center;color:#6b8b96">对外展示材料 · 仅包含公开字段</p>${selected.map((x,i)=>`<div class="caseitem"><div class="micro">CASE ${i+1} · ${escapeHTML(x.year)} · ${escapeHTML(x.area)}</div><h3>${escapeHTML(x.title)}</h3><p>配套产品：${escapeHTML(x.product)}　应用主机：${escapeHTML(x.machine)}</p><p>${escapeHTML(x.summary)}</p></div>`).join('')}<div style="margin-top:25px;font-size:11px;color:#789">本文件为展示原型生成，仅使用虚构数据；正式案例发布需审核对外公开授权。</div></div>`;printDocument(body,'对外案例册演示')}
function persistAndShow(){S.demoChanges++;save();render()}
function updateQB(){const n=id=>el(id);if(n('qb-company'))QB.company=n('qb-company').value;if(n('qb-senderContact'))QB.senderContact=n('qb-senderContact').value;if(n('qb-recipientContact'))QB.recipientContact=n('qb-recipientContact').value;if(n('qb-project'))QB.projectId=+n('qb-project').value;if(n('qb-recipient'))QB.recipient=+n('qb-recipient').value;if(n('qb-product'))QB.productId=+n('qb-product').value;if(n('qb-qty'))QB.qty=+n('qb-qty').value;if(n('qb-price'))QB.price=+n('qb-price').value;if(n('qb-discount'))QB.discount=+n('qb-discount').value;if(n('qb-term'))QB.term=n('qb-term').value;QB.params=[...document.querySelectorAll('.qb-param:checked')].map(e=>+e.value)}
function action(a,t){switch(a){case 'nav':go(t.dataset.page);break;case 'detail':S.selectedProject=+t.dataset.id;go('detail');break;case 'new-project':newProject();break;case 'new-customer':newCustomer();break;case 'new-product':newProduct();break;case 'new-update':newUpdate(t.dataset.phase);break;case 'new-performance':newPerformance();break;case 'confirm-performance':confirmPerformance(t.dataset.id);break;case 'close-modal':closeModal();break;case 'quote-builder':QB={projectId:S.selectedProject||1,recipient:1,company:'A',productId:1,qty:1,price:S.products[0].price,discount:0,params:[0,1,2],lines:[],term:'报价有效期 30 天；交货及付款条件以双方确认文件为准。',senderContact:'商务助理',recipientContact:'待填写'};go('quote-builder');break;case 'add-quote-line':{updateQB();const p=getProduct(QB.productId);if(!(QB.qty>0)||QB.qty>999999){notify('数量必须大于 0');break}if(!Number.isFinite(QB.qty)||QB.qty<=0||!Number.isFinite(QB.price)||QB.price<0||QB.discount<0||QB.discount>=100){notify('请填写有效数量、价格和折扣');break}QB.lines.push({name:p.name,model:p.model,qty:QB.qty,price:QB.price,tax:p.tax,discount:QB.discount,params:QB.params.map(i=>p.params[i]).filter(Boolean)});render();break;}case 'remove-line':updateQB();QB.lines.splice(+t.dataset.index,1);render();break;case 'create-quote':{updateQB();if(!QB.lines.length){notify('请添加产品');break}const newId=Math.max(...S.quotes.map(x=>x.id),0)+1;const code=`QT-2026-${String(newId+13).padStart(4,'0')}-V1`;const items=structuredClone(QB.lines);const amount=Number(items.reduce((a,l)=>a+l.qty*l.price*(1-l.discount/100)*(1+l.tax),0).toFixed(2));const q={id:newId,code,company:QB.company,projectId:QB.projectId,recipient:QB.recipient,items,amount,state:'已生成',version:1,owner:'商务助理',created:'2026-11-12',term:QB.term,senderContact:QB.senderContact,recipientContact:QB.recipientContact};S.quotes.unshift(q);persistAndShow();go('quotes');previewQuote(newId);notify('模拟报价版本已生成（仅当前浏览器保存）');break;}case 'preview-quote':previewQuote(t.dataset.id);break;case 'quote-change':{if(!canQuote()){notify('无权修改报价状态');break}const q=S.quotes.find(x=>x.id===+t.dataset.id);if(!q)break;q.state=q.state==='已生成'?'已发送':q.state==='已发送'?'已接受':q.state;persistAndShow();notify('状态已登记；不会自动确认为签约业绩');break;}case 'print-quote':{const q=S.quotes.find(x=>x.id===+t.dataset.id);if(q)printDocument(quotationHTML(q),'报价单预览');break}case 'case-toggle':{const id=+t.value;S.selectedCases=t.checked?[...new Set([...S.selectedCases,id])]:S.selectedCases.filter(x=>x!==id);persistAndShow();break;}case 'print-cases':printCases();break;case 'save-project':{const name=el('np-name').value.trim();if(!name){notify('请填写项目名称');return}const id=Math.max(...S.projects.map(p=>p.id))+1;S.projects.unshift({id,name,code:'PRJ-26'+String(20+id),industry:el('np-industry').value,machine:el('np-machine').value,owner:ROLE[S.role],status:'初步沟通',execution:'未启动',parties:+el('np-party').value?[+el('np-party').value]:[],location:'待补充',updated:'刚刚',desc:'新建演示项目。'});closeModal();persistAndShow();notify('已创建演示项目');break;}case 'save-customer':{const name=el('nc-name').value.trim();if(!name){notify('请填写客户名称');break}if(S.customers.some(c=>c.name===name)){notify('客户名称重复，请核对');break}S.customers.unshift({id:Date.now(),name,kind:el('nc-kind').value,contacts:[],region:el('nc-region').value||'待补充',count:0});closeModal();persistAndShow();break;}case 'save-product':{const model=el('nprod-model').value.trim(),name=el('nprod-name').value.trim();if(!model||!name){notify('型号和名称不可为空');break}if(S.products.some(p=>p.model===model)){notify('型号已存在，请勿重复');break}S.products.unshift({id:Date.now(),model,name,type:el('nprod-type').value,brand:'待配置',unit:'套',price:+el('nprod-price').value||0,tax:.13,params:el('nprod-params').value.split(/[；;]/).map(x=>x.trim()).filter(Boolean)});closeModal();persistAndShow();break;}case 'save-update':{const phase=el('nu-phase').value,projectId=+el('nu-project').value;if(S.role==='sales'&&phase==='执行'){notify('销售只能录入售前进展');break}if(S.role==='finance'&&phase==='售前'){notify('财务只能录入执行进展');break}const title=el('nu-title').value.trim();if(!title){notify('请填写进展标题');break}const pr=getP(projectId);if(phase==='执行'&&pr){pr.milestoneIndex=+el('nu-milestone').value;pr.execution='执行中'}S.updates.unshift({projectId,phase,at:'11-12 刚刚',user:ROLE[S.role],title,note:el('nu-note').value.trim()});closeModal();persistAndShow();notify('已记录项目进展（原型）');break;}case 'save-confirm':{if(!['leader','admin'].includes(S.role)){notify('仅负责人或管理员可确认');break}const record=S.performances.find(x=>x.id===+t.dataset.id);if(!record||record.confirmed){notify('该业绩已确认或不存在');break}const note=el('cp-note').value.trim();if(!note){notify('请填写确认依据说明');break}record.confirmed=true;record.basis=el('cp-basis').value;record.confirmationNote=note;closeModal();persistAndShow();notify('演示确认完成；正式版需审计与证明材料');break;}case 'save-performance':{const title=el('nperf-title').value.trim();if(!title){notify('请填写业绩名称');break}S.performances.unshift({id:Date.now(),projectId:+el('nperf-project').value,title,year:el('nperf-year').value||'2026',area:'待补充',product:el('nperf-product').value,machine:el('nperf-machine').value,investor:'待补充',summary:el('nperf-summary').value.trim(),amount:null,confirmed:false});closeModal();persistAndShow();notify('已保存待核实业绩，不能直接对外发布');break}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.matches('input[type=checkbox]'))return;action(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){S.role=e.target.value;persistAndShow();notify('已切换模拟角色；真实权限需由后端实施')}else if(e.target.dataset.action==='case-toggle'){action('case-toggle',e.target)}else if(e.target.id==='qb-product'){updateQB();const p=getProduct(QB.productId);QB.price=p.price;QB.params=p.params.map((_,i)=>i);render()}else if(e.target.classList.contains('qb-param')){updateQB();render()}else if(e.target.id?.startsWith('qb-')){updateQB();render()}});
document.addEventListener('input',e=>{if(e.target.dataset.action==='project-search'){S.projectFilter=e.target.value;const pos=e.target.selectionStart;render();const n=el('projectSearch');n?.focus();n?.setSelectionRange(pos,pos)}else if(e.target.dataset.action==='quote-search'){S.quoteFilter=e.target.value;const pos=e.target.selectionStart;render();const n=el('quoteSearch');n?.focus();n?.setSelectionRange(pos,pos)}else if(e.target.dataset.action==='customer-search'){S.custFilter=e.target.value;const pos=e.target.selectionStart;render();const n=el('customerSearch');n?.focus();n?.setSelectionRange(pos,pos)}});
render();
</script></body></html>
