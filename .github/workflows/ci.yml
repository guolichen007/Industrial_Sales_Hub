name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_package_url:
        description: HTTPS URL of the separately verified Windows installer ZIP for this commit
        type: string
      windows_package_sha256:
        description: SHA256 of that Windows installer ZIP
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: backend (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ish, POSTGRES_PASSWORD: ish, POSTGRES_DB: ish }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ish:ish@localhost:5432/ish
      PGPASSWORD: ish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: system packages (pg_dump 16 for backup tests, pdftotext for PDF tests)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update && sudo apt-get install -y postgresql-client-16 poppler-utils
          echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH
      - run: pip install -r backend/requirements.txt
      - name: migrations are complete
        run: cd backend && python manage.py makemigrations --check --dry-run
      - name: LAN 模式配置自检
        run: |
          cd backend
          ISH_MODE=LAN DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(60))") DJANGO_ALLOWED_HOSTS=10.0.0.5 python manage.py check --deploy --fail-level WARNING
      - name: tests
        run: cd backend && python -m pytest -q -rs --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pytest-results, path: backend/pytest-results.xml }

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run typecheck && npm run build
      - name: business date helpers (todayBusinessDate, dt) under several browser time zones
        run: |
          for tz in Asia/Shanghai UTC America/Los_Angeles; do
            TZ=$tz node --experimental-strip-types frontend/tests/todayBusinessDate.test.mjs
            TZ=$tz node --experimental-strip-types frontend/tests/dt.test.mjs
          done
      - name: no external CDN in build
        run: "! grep -rIl -E 'https?://(cdn|fonts\\.googleapis|unpkg|jsdelivr)' frontend/dist"
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  e2e:
    name: e2e (LAN mode, Waitress + PostgreSQL + Chromium)
    needs: [frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ish, POSTGRES_PASSWORD: ish, POSTGRES_DB: ish }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - name: install deps (Playwright 版本唯一来源 e2e/requirements.txt)
        run: |
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright --version
          python -m playwright install --with-deps chromium
      - name: start LAN server and run browser acceptance
        env:
          ISH_MODE: LAN
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
          DATABASE_URL: postgres://ish:ish@localhost:5432/ish
          ISH_LISTEN: 127.0.0.1:8000
          ISH_INIT_ADMIN_PASSWORD: Ci-admin-2026x
        run: |
          export DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(60))")
          export DATA_DIR=$RUNNER_TEMP/ishdata
          cd backend
          python manage.py migrate --noinput
          python manage.py seed_entities ../deploy/windows/config-templates/entities.json
          python manage.py init_admin --username ciadmin
          mkdir -p $RUNNER_TEMP/e2e
          python serve.py > $RUNNER_TEMP/e2e/waitress.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          E2E_BASE=http://127.0.0.1:8000 E2E_ADMIN=ciadmin E2E_ADMIN_PW=$ISH_INIT_ADMIN_PASSWORD python ../e2e/e2e_v21_lan.py $RUNNER_TEMP/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-evidence, path: "${{ runner.temp }}/e2e" }

  windows-scripts:
    name: windows (PowerShell 5.1 parse + ScriptAnalyzer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = 0
          Get-ChildItem -Path deploy/windows/scripts,deploy/windows/tests -Filter *.ps1 -File -Recurse | ForEach-Object {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $errs++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($errs) { exit 1 }
      - name: RC3 PowerShell 单元测试（Windows PowerShell 5.1 真实执行，防火墙规则/多网卡选择）
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/unit-rc3.ps1
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/unit-rc3-vc.ps1
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/unit-f4-recovery.ps1
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/unit-f4-restore-wrapper.ps1
          if ($LASTEXITCODE) { exit 1 }
      - name: native Windows PostgreSQL 16.16 and installer ACL
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'postgresql-16.16-win-x64.zip'
          $out = Join-Path $env:RUNNER_TEMP 'ish-pg16-native'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://get.enterprisedb.com/postgresql/postgresql-16.16-1-windows-x64-binaries.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '5c0d06f3d26a929ecb36dd931409f1e51a4181355794a259b90aae8bffc57a9f') { throw 'PostgreSQL archive digest mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          $winsw = Join-Path $out 'WinSW-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' -OutFile $winsw
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/unit-install-native.ps1 -PgSource (Join-Path $out 'pgsql') -WinSw $winsw
          if ($LASTEXITCODE) { exit 1 }
      - name: official Windows install and repeat from verified package
        if: inputs.windows_package_url != '' || inputs.windows_package_sha256 != ''
        shell: powershell
        env:
          ISH_QA_PACKAGE_URL: ${{ inputs.windows_package_url }}
          ISH_QA_PACKAGE_SHA256: ${{ inputs.windows_package_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $uri = [uri]$env:ISH_QA_PACKAGE_URL
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $env:ISH_QA_PACKAGE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Both HTTPS installer URL and pinned SHA256 are required' }
          $zip = Join-Path $env:RUNNER_TEMP 'ish-verified-package.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $zip
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/smoke-install-package.ps1 -Zip $zip -ZipSha256 $env:ISH_QA_PACKAGE_SHA256 -SourceSha $env:GITHUB_SHA -Evidence (Join-Path $env:RUNNER_TEMP 'ish-install-smoke')
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.windows_package_url != '' || inputs.windows_package_sha256 != '')
        with: { name: windows-install-smoke, path: "${{ runner.temp }}/ish-install-smoke" }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path deploy/windows/scripts -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingPlainTextForPassword,PSUseSingularNouns,PSUseBOMForUnicodeEncodedFile
          $r | Format-Table -AutoSize
          if ($r.Count) { exit 1 }
      - name: Windows Python smoke (waitress + embedded deps import)
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          cd backend
          $env:ISH_MODE = 'DEMO'
          python -c "import django,os;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');django.setup();import waitress,reportlab,psycopg;print('ok')"
          python -m pytest -q tests/test_v21_templates.py -k "engineering or upper or bundled"

  security:
    name: dependency audit + secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit（失败即失败，不再降级为 warning）
        run: pip install pip-audit==2.9.0 && pip-audit -r backend/requirements.txt -r e2e/requirements.txt --strict
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  manifest:
    name: artifact manifest
    needs: [backend, frontend, e2e, windows-scripts, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "jobs: backend, frontend, e2e, windows-scripts, security passed (same run attempt)"
          } > manifest.txt
          cat manifest.txt
      - uses: actions/upload-artifact@v4
        with: { name: ci-manifest, path: manifest.txt }
