name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ish, POSTGRES_PASSWORD: ish, POSTGRES_DB: ish }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ish:ish@localhost:5432/ish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core poppler-utils
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python manage.py makemigrations --check --dry-run
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run typecheck && npm run build
